spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seguranca_comunitaria}
spring.datasource.username=${DB_USERNAME:seguranca}
spring.datasource.password=${DB_PASSWORD:seguranca123}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Expone o minimo necessario para operacao, monitoramento e verificacao de saude.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
server.forward-headers-strategy=framework

# Informacoes basicas consumidas pelo endpoint /actuator/info.
info.app.name=${spring.application.name}
info.app.environment=${VMAB_ENVIRONMENT:development}
info.app.version=${VMAB_APP_VERSION:0.0.1-SNAPSHOT}

security.jwt.secret=${JWT_SECRET:vmab-dev-secret-change-in-production-please}
security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
vmab.storage-root=${VMAB_STORAGE_ROOT:storage}
vmab.log-dir=${VMAB_LOG_DIR:logs}
# Retencao tecnica aplicada a tokens temporarios, sessoes e evidencias sensiveis.
vmab.retention.enabled=${VMAB_RETENTION_ENABLED:true}
vmab.retention.cleanup-cron=${VMAB_RETENTION_CLEANUP_CRON:0 15 3 * * *}
vmab.retention.password-reset-token-retention-hours=${VMAB_PASSWORD_RESET_RETENTION_HOURS:24}
vmab.retention.resident-session-retention-days=${VMAB_RESIDENT_SESSION_RETENTION_DAYS:14}
vmab.retention.incident-evidence-retention-days=${VMAB_INCIDENT_EVIDENCE_RETENTION_DAYS:3650}
vmab.retention.remove-orphan-evidence-files=${VMAB_REMOVE_ORPHAN_EVIDENCE_FILES:true}
vmab.notifications.expo.enabled=${VMAB_EXPO_NOTIFICATIONS_ENABLED:true}
vmab.notifications.expo.base-url=${VMAB_EXPO_NOTIFICATIONS_BASE_URL:https://exp.host/--/api/v2/push/send}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
