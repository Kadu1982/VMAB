name: seguranca-comunitaria

services:
  postgres:
    image: postgres:17-alpine
    container_name: seguranca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default: {}
      shared_proxy:
        aliases:
          - vmab-postgres

  backend:
    build:
      context: ./backend
    container_name: seguranca-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://vmab-postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-12}
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:-false}
      VMAB_LOG_DIR: /app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default: {}
      shared_proxy:
        aliases:
          - vmab-backend
    # Em producao, o proxy e a orquestracao precisam saber quando a API realmente ficou pronta.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Os logs ficam persistidos para auditoria e suporte na VPS.
    volumes:
      - backend_logs:/app/logs

  dashboard-web:
    build:
      context: ./dashboard-web
    container_name: seguranca-dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default: {}
      shared_proxy:
        aliases:
          - vmab-dashboard

networks:
  shared_proxy:
    external: true
    name: saude_saude_network

volumes:
  postgres_data:
  backend_logs:
